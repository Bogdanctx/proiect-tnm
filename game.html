<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Packet Tracer Maze</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Generated javascript library includes -->
    <script type="application/javascript" src="heavy.js"></script>


    <script type="text/javascript" src="pdInit.js"></script>

    
</head>
<body>
    
    <div id="instructions">
        <h1>Press click to start</h1>
        <p>W, A, S, D to move | Mouse to look<br><br><b>SPACEBAR: Scan Path (Drains Light)</b></p>

        <p>Enable Sound</p>
        <input type="checkbox" id="transportButton" onchange="toggleTransport();" class="preventEvent">
    </div>
    
    <canvas id="radarCanvas" width="200" height="200"></canvas>

    <div id="ui">
        Finder Power: <span id="powerVal">100</span>%<br>
        <span id="objective">Pasul 1: Gaseste switch-ul!</span>
    </div>
    <div id="levelComplete" style="flex-direction: column;">
        <div>NETWORK RESTORED!</div>
        <img id="finishGif" src="finish.gif" style="display:none; margin-top: 20px; max-width: 400px;">
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
